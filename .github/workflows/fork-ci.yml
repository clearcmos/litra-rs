# CI for this fork's own additions.
#
# Upstream's build_and_release.yml is gated `if: github.repository ==
# 'timrogers/litra-rs'`, so on a fork it skips every job, including cargo test.
# That left the fork with no test run at all and nothing covering the plasmoid,
# the PKGBUILD or the installer script. This workflow is a separate file on
# purpose: it never conflicts when upstream changes its own workflows, and it
# no-ops if upstream ever ends up with a copy of it.

name: fork-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    if: github.repository != 'timrogers/litra-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # hidapi builds against libudev on Linux, and eframe/tray-icon (the
      # `menubar` feature) pull in GTK and libappindicator.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Use the pinned toolchain
        run: rustup override set 1.92.0

      - run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      # --all-features is what brings src/menubar.rs into scope. Without it the
      # fork's own Rust file is never compiled or linted by anything.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

  plasmoid:
    name: Plasmoid
    if: github.repository != 'timrogers/litra-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # The widget's conversion and parsing logic lives in a plain .mjs that
      # both QML and node load unchanged, so this needs no Qt and no device.
      - name: Unit tests
        run: node --test tray-plasmoid/tests/*.test.mjs

      - name: Install Qt QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      # The script resolves the Qt 6 binary itself. There is no portable name
      # for it, and picking up a Qt 5 qmllint would exit 0 without reading the
      # file, so it asserts the major version rather than trusting PATH.
      #
      # A parse check, not a full lint: this runner has qmllint but none of the
      # QtQuick or Plasma 6 QML modules, so no type here can be resolved. What
      # this gates is that main.qml and litra.mjs parse, which is worth having,
      # since a syntax error in either breaks the widget outright. The full
      # lint runs on a machine with Plasma installed (see CLAUDE.md).
      - name: QML and JS parse check
        run: bash tray-plasmoid/tests/run-qmllint.sh --no-imports

      - name: shellcheck
        run: shellcheck tray-plasmoid/install.sh

  packaging:
    name: Packaging
    if: github.repository != 'timrogers/litra-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # makepkg is not available here, so lint the PKGBUILD as the bash it is.
      # SC2034 and SC2154 are noise on a PKGBUILD: makepkg both sets and
      # consumes the globals, so every one of them reads as unused or unset.
      # SC2164 (bare cd) likewise: makepkg runs each function under errexit, so
      # a failed cd already aborts the build.
      - name: shellcheck PKGBUILD
        run: shellcheck --shell=bash --exclude=SC2034,SC2154,SC2164 PKGBUILD

      # Behavioral gate: the widget fails to load if any file main.qml imports
      # is missing from the installed tree, which is exactly how a JS module
      # once shipped absent. Prove package() lands every file in the source
      # package directory.
      - name: PKGBUILD ships the whole plasmoid
        run: bash tray-plasmoid/tests/check-packaging.sh

  fork-ci-ok:
    name: fork-ci-ok
    if: always() && github.repository != 'timrogers/litra-rs'
    needs: [rust, plasmoid, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more jobs failed"
            exit 1
          fi
          echo ok
